[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "rag-agent"
version = "0.1.0"
description = "agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "ollama>=0.3.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
    "pymupdf>=1.24.0",
    "markdownify>=0.13.0",
    "aiolimiter>=1.1.0",
    "tenacity>=8.2.0",
    "typer>=0.9.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "transformers>=4.30.0",
    "torch">=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
rag-agent = "rag_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]


[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "langchain_core.*"] 
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/rag_agent --cov-report=term-missing"